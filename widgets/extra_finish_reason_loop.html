<h1>Extra · How finish_reason drives an agent loop</h1>
<p class="lead">Supporting material: the whole single agent is one while loop steered by one field.</p>
<svg width="100%" viewBox="0 0 680 500" role="img"><title>How finish_reason drives an agent loop</title><desc>Messages go to an LLM call; finish_reason branches to tool_calls which runs tools and loops back, stop which returns content, or length which means truncated output.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="box" x="260" y="30" width="160" height="44" rx="8" stroke-width="0.75"/><text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">Messages</text>
<line x1="340" y1="74" x2="340" y2="106" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="230" y="110" width="220" height="56" rx="8" stroke-width="0.75"/><text class="th" x="340" y="128" text-anchor="middle" dominant-baseline="central">LLM call</text><text class="ts" x="340" y="148" text-anchor="middle" dominant-baseline="central">Generates one response</text></g>
<line x1="340" y1="166" x2="340" y2="206" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="230" y="210" width="220" height="56" rx="8" stroke-width="0.75"/><text class="th" x="340" y="228" text-anchor="middle" dominant-baseline="central">finish_reason?</text><text class="ts" x="340" y="248" text-anchor="middle" dominant-baseline="central">Why it stopped</text></g>
<line x1="300" y1="266" x2="145" y2="316" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="266" x2="340" y2="316" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="266" x2="535" y2="316" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="50" y="320" width="180" height="56" rx="8" stroke-width="0.75"/><text class="th" x="140" y="338" text-anchor="middle" dominant-baseline="central">tool_calls</text><text class="ts" x="140" y="358" text-anchor="middle" dominant-baseline="central">Model wants a tool</text></g>
<g class="c-amber"><rect x="250" y="320" width="180" height="56" rx="8" stroke-width="0.75"/><text class="th" x="340" y="338" text-anchor="middle" dominant-baseline="central">stop</text><text class="ts" x="340" y="358" text-anchor="middle" dominant-baseline="central">Model finished text</text></g>
<g class="c-amber"><rect x="450" y="320" width="180" height="56" rx="8" stroke-width="0.75"/><text class="th" x="540" y="338" text-anchor="middle" dominant-baseline="central">length</text><text class="ts" x="540" y="358" text-anchor="middle" dominant-baseline="central">Hit max_tokens</text></g>
<line x1="140" y1="376" x2="140" y2="406" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="376" x2="340" y2="406" class="arr" marker-end="url(#arrow)"/>
<line x1="540" y1="376" x2="540" y2="406" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="50" y="410" width="180" height="56" rx="8" stroke-width="0.75"/><text class="th" x="140" y="428" text-anchor="middle" dominant-baseline="central">Run tools</text><text class="ts" x="140" y="448" text-anchor="middle" dominant-baseline="central">Append results</text>
<rect class="box" x="250" y="410" width="180" height="56" rx="8" stroke-width="0.75"/><text class="th" x="340" y="428" text-anchor="middle" dominant-baseline="central">Return content</text><text class="ts" x="340" y="448" text-anchor="middle" dominant-baseline="central">Loop ends</text>
<rect class="box" x="450" y="410" width="180" height="56" rx="8" stroke-width="0.75"/><text class="th" x="540" y="428" text-anchor="middle" dominant-baseline="central">Truncated output</text><text class="ts" x="540" y="448" text-anchor="middle" dominant-baseline="central">Raise max_tokens</text>
<path d="M50 438 L30 438 L30 138 L226 138" fill="none" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="40" y="186" dominant-baseline="central">↻ call LLM again</text>
</svg>
