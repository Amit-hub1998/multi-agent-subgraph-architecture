<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slide 2 · Why single agents fail</title>
<link rel="stylesheet" href="vendor/tabler-icons.min.css">
<link rel="stylesheet" href="_base.css">
<style>
.btns{display:flex;gap:8px;margin:4px 0 8px}
.btns button{flex:1;padding:8px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);font:inherit;font-size:14px;cursor:pointer}
.btns button.on{border-color:var(--border-accent);background:var(--bg-accent);color:var(--text-accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stat{background:var(--surface-1);border-radius:8px;padding:8px}
.k{font-size:12px;color:var(--text-secondary)}
.v{font-size:18px;font-weight:600;color:var(--text-primary)}
.bar{height:6px;background:var(--surface-0);border-radius:3px;margin-top:4px;overflow:hidden}
#cbar{height:100%;width:0;background:#1D9E75;transition:width .4s}
#cap{margin-top:10px;font-size:15px;color:var(--text-primary)}
#smell{font-size:13px;color:var(--text-danger);min-height:16px;margin-top:2px;font-weight:600}
#code{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary);margin-top:4px;min-height:18px}
.ag{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){.shake{animation:sh .2s linear 4}@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}}
</style></head>
<body><main>
<a class="back" href="index.html">← All visuals</a>
<h1>Slide 2 · Why Single Agents Fail</h1>
<p class="lead">BAU defect-fix agent. Same graph, same tools: one ticket vs three tickets in one session.</p>
<div class="btns"><button id="bh" class="on">Happy flow: 1 ticket</button><button id="bc">Chaotic flow: 3 tickets</button></div>
<svg id="g" width="100%" viewBox="0 0 680 450" role="img"><title>Single agent BAU defect graph</title><desc>Ticket, single agent, SQL, code search, run tests, human approval and close ticket nodes.</desc></svg>
<div id="cap">Press a flow to play</div>
<div id="smell"></div>
<div id="code"></div>
<div class="stats">
<div class="stat"><div class="k">LLM calls</div><div class="v" id="sc">0</div></div>
<div class="stat"><div class="k">Wasted loops</div><div class="v" id="sl">0</div></div>
<div class="stat"><div class="k">Context used</div><div class="v" id="sx">0%</div><div class="bar"><div id="cbar"></div></div></div>
</div>
<script>
const NS='http://www.w3.org/2000/svg',XH='http://www.w3.org/1999/xhtml',svg=document.getElementById('g');
const N={ticket:[340,45,26,'ti-ticket','BAU ticket'],agent:[340,215,40,'ti-robot','Single agent'],sql:[120,130,28,'ti-database','Run SQL'],code:[560,130,28,'ti-code','Search code'],tests:[120,300,28,'ti-test-pipe','Run tests'],human:[560,300,28,'ti-user-check','Human sign-off'],close:[560,400,28,'ti-circle-check','Close ticket']};
const E=[['ticket','agent'],['agent','sql'],['agent','code'],['agent','tests'],['agent','human'],['human','close']];
const SIDE=['ticket','human','close'];
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;}
const key=(a,b)=>[a,b].sort().join('-'),edges={};
E.forEach(([a,b])=>{const[ax,ay,ar]=N[a],[bx,by,br]=N[b],dx=bx-ax,dy=by-ay,l=Math.hypot(dx,dy);
edges[key(a,b)]=el('line',{x1:ax+dx/l*(ar+4),y1:ay+dy/l*(ar+4),x2:bx-dx/l*(br+4),y2:by-dy/l*(br+4),style:'stroke:var(--border-strong);stroke-width:1'});});
let agentG,agentC;
for(const id in N){const[x,y,r,ic,lb]=N[id];const g=el('g',{});
const c=el('circle',{cx:x,cy:y,r:r,style:'fill:var(--surface-2);stroke:'+(id==='agent'?'#534AB7':'var(--border-strong)')+';stroke-width:'+(id==='agent'?1.5:1)},g);
const fo=el('foreignObject',{x:x-16,y:y-16,width:32,height:32},g);const d=document.createElementNS(XH,'div');
d.setAttribute('style','font-size:'+(id==='agent'?28:22)+'px;line-height:32px;text-align:center;color:'+(id==='agent'?'#534AB7':'var(--text-primary)'));d.innerHTML='<i class="ti '+ic+'" aria-hidden="true"></i>';fo.appendChild(d);
if(SIDE.includes(id))el('text',{x:x+r+8,y:y,'dominant-baseline':'central',class:'ts'},g).textContent=lb;
else el('text',{x:x,y:y+r+16,'text-anchor':'middle',class:'ts'},g).textContent=lb;
if(id==='agent'){agentG=g;agentC=c;g.setAttribute('class','ag');}}
const dot=el('circle',{cx:340,cy:45,r:7,style:'fill:#1D9E75;opacity:0'});
const happy=[
{f:'ticket',t:'agent',c:'Defect: PD is null for 120 accounts',k:'messages = [ticket_4521]',x:5},
{f:'agent',t:'sql',c:'Find where the nulls come from',k:'finish_reason = "tool_use" → run_sql(count nulls by source)',x:5},
{f:'sql',t:'agent',c:'All 120 come from one source feed',k:'messages.append(tool_result)  # 5 rows',x:5},
{f:'agent',t:'code',c:'Look at how that feed is joined',k:'finish_reason = "tool_use" → search_code("pd_join")',x:5},
{f:'code',t:'agent',c:'Join is on the wrong key',k:'messages.append(tool_result)',x:6},
{f:'agent',t:'tests',c:'Apply fix, run reconciliation',k:'finish_reason = "tool_use" → run_tests(fix_4521)',x:5},
{f:'tests',t:'agent',c:'Reconciliation passes',k:'messages.append({"status": "pass"})',x:3},
{f:'agent',t:'human',c:'Fix and evidence sent for sign-off',k:'finish_reason = "end_turn" → human_signoff',x:3},
{f:'human',t:'close',c:'Approved. Ticket closed.',k:'approved = True → close_ticket(4521)',x:0}];
const chaos=[
{f:'ticket',t:'agent',c:'Three defects queued in one session',k:'messages = [ticket_4521, ticket_4522, ticket_4523]',s:'',x:10},
{f:'agent',t:'sql',c:'Pulls the whole table to "have a look"',k:'finish_reason = "tool_use" → run_sql("SELECT * ...")',s:'Unbounded tool output',x:5},
{f:'sql',t:'agent',c:'50,000 rows land in the context',k:'messages.append(tool_result)  # 30k tokens',s:'No limit on what a tool returns',x:28},
{f:'agent',t:'code',c:'Finds the join bug for ticket 4521',k:'finish_reason = "tool_use" → search_code("pd_join")',s:'',x:6},
{f:'code',t:'agent',c:'Bug found, but it switches to ticket 4522',k:'messages.append(tool_result)',s:'Task switching inside one context',x:6},
{f:'agent',t:'sql',c:'Queries accounts for 4522',k:'finish_reason = "tool_use" → run_sql(accounts_4522)',s:'Shared state across tasks',x:5},
{f:'sql',t:'agent',c:'Now two account lists sit side by side',k:'messages.append(tool_result)',s:'Shared state across tasks',x:10,l:1},
{f:'agent',t:'tests',c:'Tests fix 4521 using 4522 data',k:'finish_reason = "tool_use" → run_tests(fix_4521, data_4522)',s:'Wrong state passed to step',x:4},
{f:'tests',t:'agent',c:'Test fails',k:'{"status": "fail"}',s:'',x:4,l:1},
{f:'agent',t:'tests',c:'Retries the same fix',k:'finish_reason = "tool_use" → run_tests(fix_4521)  # again',s:'No retry budget',x:4,l:1},
{f:'tests',t:'agent',c:'Fails again',k:'{"status": "fail"}',s:'',x:4,l:1},
{f:'agent',t:'tests',c:'Edits the test so it passes',k:'finish_reason = "tool_use" → edit_test()  # marks own homework',s:'Maker is also the checker',x:5,l:1},
{f:'tests',t:'agent',c:'Test "passes"',k:'{"status": "pass"}  # false green',s:'Maker is also the checker',x:3,l:1},
{f:'agent',t:'human',c:'Sends fix for 4521 with evidence from 4522',k:'finish_reason = "end_turn" → human_signoff',s:'',x:3},
{f:'human',t:'agent',c:'Rejected: evidence does not match ticket',k:'messages.append(reject_feedback)',s:'No checkpoint to resume from',x:3,l:1},
{f:'agent',t:'agent',c:'Context full. No ticket closed.',k:'finish_reason = "max_tokens"  # 3 tickets, 0 fixed',s:'Single point of failure',x:100,l:1}];
let run=0;const $=i=>document.getElementById(i);
function reset(){for(const k in edges)edges[k].style.cssText='stroke:var(--border-strong);stroke-width:1';agentC.style.stroke='#534AB7';$('sc').textContent=0;$('sl').textContent=0;$('sx').textContent='0%';$('cbar').style.width='0';$('smell').textContent='';dot.style.opacity=0;}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function move(a,b,col,id){return new Promise(res=>{const[ax,ay]=N[a],[bx,by]=N[b],t0=performance.now();dot.style.fill=col;dot.style.opacity=1;
function f(t){if(id!==run)return res();const p=Math.min(1,(t-t0)/650);dot.setAttribute('cx',ax+(bx-ax)*p);dot.setAttribute('cy',ay+(by-ay)*p);p<1?requestAnimationFrame(f):res();}requestAnimationFrame(f);});}
async function play(mode){const id=++run;reset();const S=mode==='h'?happy:chaos;let calls=0,loops=0,ctx=0;
for(let i=0;i<S.length;i++){const s=S[i];if(id!==run)return;
const col=mode==='h'?'#1D9E75':(loops<2?'#BA7517':'#A32D2D');
$('cap').textContent='Step '+(i+1)+'/'+S.length+': '+s.c;$('code').textContent=s.k;$('smell').textContent=s.s?'Design smell: '+s.s:'';
if(s.f===s.t){agentG.classList.remove('shake');void agentG.getBBox();agentG.classList.add('shake');await wait(900);}
else{const e=edges[key(s.f,s.t)];e.style.cssText='stroke:'+col+';stroke-width:2.5';await move(s.f,s.t,col,id);if(id!==run)return;e.style.cssText='stroke:'+col+';stroke-width:1.5';}
if(s.t==='agent')calls++;if(s.l)loops++;ctx=Math.min(100,ctx+s.x);
$('sc').textContent=calls;$('sl').textContent=loops;$('sx').textContent=ctx+'%';$('cbar').style.width=ctx+'%';
$('cbar').style.background=ctx<50?'#1D9E75':ctx<80?'#BA7517':'#A32D2D';if(ctx>=70)agentC.style.stroke='#A32D2D';
await wait(350);}
dot.style.opacity=0;}
$('bh').onclick=()=>{$('bh').classList.add('on');$('bc').classList.remove('on');play('h');};
$('bc').onclick=()=>{$('bc').classList.add('on');$('bh').classList.remove('on');play('c');};
play('h');
</script>
</main></body></html>
