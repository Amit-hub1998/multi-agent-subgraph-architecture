<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Extra · Agent trace (slide 4 backup)</title>
<link rel="stylesheet" href="_base.css">
<style>
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chips button{padding:6px 10px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);font:inherit;font-size:13px;cursor:pointer}
.chips button.on{border-color:var(--border-danger);background:var(--bg-danger);color:var(--text-danger)}
.row{padding:8px 10px;border-radius:8px;border:1px solid var(--border);margin-bottom:6px;transition:opacity .3s,border-color .3s;background:var(--surface-1)}
.row.hit{border-color:var(--border-danger)}
.row.dim{opacity:.3}
.top{font-family:var(--font-mono);font-size:12px;color:var(--text-primary);display:flex;gap:8px;flex-wrap:wrap}
.fr{color:var(--text-accent)} .fr.bad{color:var(--text-danger)}
.bar{height:6px;background:var(--surface-0);border-radius:3px;margin-top:6px;overflow:hidden}
.fill{height:100%}
.tok{font-size:12px;color:var(--text-secondary);margin-top:3px}
#cap{font-size:14px;color:var(--text-primary);margin-top:6px;min-height:40px}
</style></head>
<body><main>
<a class="back" href="index.html">← All visuals</a>
<h1>Extra · Agent trace of the chaotic run (appendix)</h1>
<p class="lead">For the technical question "how would I spot this in production?" Tap a failure mode to highlight the calls.</p>
<div class="chips" id="chips"></div>
<div id="rows"></div>
<div id="cap">Tap a failure mode to see where it shows up in the trace.</div>
<script>
const R=[[2,'tool_use','run_sql("SELECT * FROM pd_accounts")'],[32,'tool_use','search_code("pd_join")'],[34,'tool_use','run_sql(accounts_4522)'],[38,'tool_use','run_tests(fix_4521, data_4522)'],[39,'tool_use','run_tests(fix_4521, data_4522)'],[40,'tool_use','edit_test("recon_4521")'],[41,'end_turn','human_signoff(4521)'],[44,'max_tokens','—']];
const MAX=48;
const S={'Context bloat':{r:[1,2,3,4,5,6,7],c:'Input tokens jump from 2k to 32k after one query and never come down. Acting dumped raw data where thinking happens.'},
'Repeated tool calls':{r:[3,4],c:'Same tool, same arguments, back to back. Acting without a thinking step that says "this failed, change approach".'},
'Task contamination':{r:[2,3],c:'IDs from ticket 4522 appear in work for 4521. One context, several tasks, no isolation.'},
'False green':{r:[5],c:'A test passes right after the agent edited it. Checking was done by the same brain that acted.'},
'Premature end_turn':{r:[6],c:'end_turn with mismatched evidence. The model stopped talking; the task was not done.'},
'Truncation':{r:[7],c:'max_tokens: output cut mid-way, no ticket closed. The loop had no exit rule except "model says stop".'}};
const rows=document.getElementById('rows'),chips=document.getElementById('chips'),cap=document.getElementById('cap');
const els=R.map(([t,f,tool],i)=>{const d=document.createElement('div');d.className='row';const pct=Math.round(t/MAX*100),col=pct<50?'#1D9E75':pct<80?'#BA7517':'#A32D2D';
d.innerHTML='<div class="top"><span>#'+(i+1)+'</span><span class="fr'+(f==='tool_use'?'':' bad')+'">'+f+'</span><span>'+tool+'</span></div><div class="bar"><div class="fill" style="width:'+pct+'%;background:'+col+'"></div></div><div class="tok">'+t+'k of '+MAX+'k input tokens</div>';rows.appendChild(d);return d;});
let cur=null;
Object.keys(S).forEach(k=>{const b=document.createElement('button');b.textContent=k;chips.appendChild(b);
b.onclick=()=>{cur=cur===k?null:k;[...chips.children].forEach(c=>c.classList.toggle('on',c.textContent===cur));
els.forEach((e,i)=>{const hit=cur&&S[cur].r.includes(i);e.classList.toggle('hit',!!hit);e.classList.toggle('dim',!!cur&&!hit);});
cap.textContent=cur?S[cur].c:'Tap a failure mode to see where it shows up in the trace.';};});
</script>
</main></body></html>
