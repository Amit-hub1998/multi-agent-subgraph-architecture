<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slide 3 · Context tape</title>
<link rel="stylesheet" href="_base.css">
<style>
.btns{display:flex;gap:8px;margin:4px 0 8px}
.btns button{flex:1;padding:8px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);font:inherit;font-size:14px;cursor:pointer}
.btns button.on{border-color:var(--border-accent);background:var(--bg-accent);color:var(--text-accent)}
#tape{position:relative}
.blk{position:absolute;border-radius:6px;border:1px solid;padding:0 8px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--text-primary);transition:left .7s ease,width .7s ease;overflow:hidden;white-space:nowrap}
.tg{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);transition:opacity .4s}
.T{background:#EEEDFE;border-color:#534AB7}
.A{background:#E1F5EE;border-color:#0F6E56}
.C{background:#FAECE7;border-color:#993C1D}
.hd{position:absolute;top:0;height:22px;font-size:13px;font-weight:600;color:var(--text-secondary);text-align:center;transition:opacity .4s}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-secondary);margin-top:10px;flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle;border:1px solid}
#cap{font-size:14px;color:var(--text-primary);margin-top:8px}
@media (prefers-reduced-motion:reduce){.blk,.tg,.hd{transition:none}}
</style></head>
<body><main>
<a class="back" href="index.html">← All visuals</a>
<h1>Slide 3 · Thinking + Acting + Checking Are Mixed Together</h1>
<p class="lead">The chaotic run's messages, coloured by job. Switch to "Sorted by job" to see the Morph moment.</p>
<div class="btns"><button id="bm" class="on">One context (mixed)</button><button id="bs">Sorted by job</button></div>
<div id="tape"></div>
<div id="cap"></div>
<div class="legend"><span><span class="sw T"></span>Thinking</span><span><span class="sw A"></span>Acting</span><span><span class="sw C"></span>Checking</span><span style="font-family:var(--font-mono)">right tag = signal the loop sees</span></div>
<script>
const B=[
['T','Read 3 tickets','no signal'],['A','SQL: SELECT *','tool_use'],['A','50k rows','tool',64],['T','Suspect join','no signal'],
['A','Search code','tool_use'],['T','Switch to 4522','no signal'],['A','SQL: 4522','tool_use'],['A','Test 4521+4522','tool_use'],
['C','Fail','tool'],['A','Retry same fix','tool_use'],['C','Fail again','tool'],['A','Edit the test','tool_use'],
['C','False pass','tool'],['T','Ask sign-off','end_turn'],['C','Human rejects','user'],['T','Context full','max_tokens']];
const lane={T:0,A:1,C:2},tape=document.getElementById('tape'),cap=document.getElementById('cap');
const H=30,G=6,TOP=30;let y=TOP;const els=[];
const hm=document.createElement('div');hm.className='hd';hm.textContent='One agent, one context window, time flows down';tape.appendChild(hm);
const hs=['Thinking','Acting','Checking'].map(t=>{const d=document.createElement('div');d.className='hd';d.textContent=t;tape.appendChild(d);return d;});
B.forEach(([j,l,t,h])=>{const d=document.createElement('div');d.className='blk '+j;d.style.top=y+'px';d.style.height=(h||H)+'px';
d.innerHTML='<span>'+l+'</span><span class="tg">'+t+'</span>';tape.appendChild(d);els.push([d,j]);y+=(h||H)+G;});
tape.style.height=y+'px';
let mode='m';
function layout(){const W=tape.clientWidth,cw=(W-16)/3;
hm.style.left='0';hm.style.width=W+'px';hm.style.opacity=mode==='m'?1:0;
hs.forEach((h,i)=>{h.style.left=i*(cw+8)+'px';h.style.width=cw+'px';h.style.opacity=mode==='s'?1:0;});
els.forEach(([d,j])=>{const tg=d.querySelector('.tg');
if(mode==='m'){d.style.left='0';d.style.width=W+'px';tg.style.opacity=1;}
else{d.style.left=lane[j]*(cw+8)+'px';d.style.width=cw+'px';tg.style.opacity=0;}});
cap.textContent=mode==='m'?'Three jobs interleaved in one context. finish_reason only fires on acting; thinking and checking have no signal of their own.':'Same messages, sorted by job. Each lane is a different responsibility, and could be its own agent.';}
document.getElementById('bm').onclick=()=>{mode='m';document.getElementById('bm').classList.add('on');document.getElementById('bs').classList.remove('on');layout();};
document.getElementById('bs').onclick=()=>{mode='s';document.getElementById('bs').classList.add('on');document.getElementById('bm').classList.remove('on');layout();};
window.addEventListener('resize',layout);layout();
</script>
</main></body></html>
